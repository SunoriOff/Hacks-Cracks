<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sunori — Film</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="container">
    <div class="nav">
      <a class="brand" href="index.html" aria-label="Sunori">
        <div class="logo"><img src="vrai_logo.png" alt="Sunori" /></div>
        <div>
          <div>Sunori</div>
          <small>Hacks&Cracks</small>
        </div>
      </a>
      <nav class="navlinks">
        <a class="pill" href="index.html">Accueil</a>
        <a class="pill" href="softwares.html">Logiciels</a>
        <a class="pill active" href="films.html">Films</a>
      </nav>
    </div>
  </div>
</header>

<main class="container">
  <section class="hero" style="padding-top:28px">
    <div id="film-root" class="card hero-card"></div>
  </section>
</main>

<script>
  const $ = (q, el=document) => el.querySelector(q);

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function getParam(name){
    const u = new URL(location.href);
    return u.searchParams.get(name);
  }

  function isProbablyIframeUrl(url){
    // Pour un embed officiel (YouTube/Vimeo/serveur autorisé)
    return /^https?:\/\/.+/i.test(url);
  }

  fetch("film.json", {cache:"no-store"})
    .then(r => r.json())
    .then(data => {
      const id = getParam("id");
      const film = (data.films || []).find(x => x.id === id);

      if(!film){
        $("#film-root").innerHTML = `
          <div class="kicker"><span class="dot"></span>Film</div>
          <h1>Introuvable</h1>
          <p class="lead">Ce film n’existe pas (ou l’URL est incorrecte).</p>
          <div class="cta-row">
            <a class="btn" href="films.html"><span class="icon icon-arrow"></span> Retour aux films</a>
          </div>
        `;
        return;
      }

      document.title = `Sunori — ${film.title}`;

      // --- AFFICHES (tu peux utiliser poster / cover / image / affiche dans ton JSON) ---
      const posterUrl = film.poster || film.cover || film.image || film.affiche || "";

      const posterBlock = posterUrl
        ? `
          <img
            src="${escapeHtml(posterUrl)}"
            alt="Affiche : ${escapeHtml(film.title)}"
            style="
              width:100%;
              max-height:920px;
              object-fit:contain;
              object-position:center;
              border-radius:18px;
              border:1px solid var(--border);
              background:#000;
              box-shadow:0 30px 80px rgba(0,0,0,.6);
              margin-top:14px;
            "
            loading="lazy"
          />
        `
        : `
          <div class="panel" style="margin-top:14px">
            <p class="lead" style="margin:0">Aucune affiche configurée (champ <b>poster</b> / <b>cover</b> / <b>image</b> / <b>affiche</b>).</p>
          </div>
        `;

      // --- PLAYER ---
      const player = film.videoUrl && isProbablyIframeUrl(film.videoUrl)
        ? `
          <div class="panel" style="margin-top:16px">
            <h3>Lecture</h3>
            <div style="
              position:relative;
              padding-top:56.25%;
              border-radius:16px;
              overflow:hidden;
              border:1px solid var(--border);
              background:rgba(0,0,0,.25)
            ">
              <iframe
                src="${escapeHtml(film.videoUrl)}"
                style="position:absolute; inset:0; width:100%; height:100%; border:0"
                allow="autoplay; fullscreen; picture-in-picture"
                allowfullscreen
                referrerpolicy="no-referrer"
                loading="lazy"
                title="${escapeHtml(film.title)}"
              ></iframe>
            </div>
            <p class="lead" style="margin:12px 0 0">
              Assure-toi que la source vidéo est légale (droits / embed officiel).
            </p>
          </div>
        `
        : `
          <div class="panel" style="margin-top:16px">
            <h3>Lecture</h3>
            <p class="lead" style="margin:0">
              Aucune source vidéo configurée (champ <b>videoUrl</b> vide).
            </p>
          </div>
        `;

      // --- RENDER ---
      $("#film-root").innerHTML = `
        <div class="kicker"><span class="dot"></span>Film</div>
        <h1>${escapeHtml(film.title)}</h1>

        ${posterBlock}

        <p class="lead" style="margin-top:12px">${escapeHtml(film.synopsis || "—")}</p>

        <div class="chips" style="margin-top:10px">
          ${(film.tags || []).map(t => `<span class="chip">${escapeHtml(t)}</span>`).join("")}
        </div>

        <div class="cta-row" style="margin-top:16px">
          <a class="btn" href="films.html"><span class="icon icon-arrow"></span> Retour</a>
        </div>

        ${player}
      `;
    })
    .catch(err => {
      console.error(err);
      $("#film-root").innerHTML = `
        <div class="kicker"><span class="dot"></span>Film</div>
        <h1>Erreur</h1>
        <p class="lead">${escapeHtml(err.message || String(err))}</p>
        <div class="cta-row">
          <a class="btn" href="films.html"><span class="icon icon-arrow"></span> Retour</a>
        </div>
      `;
    });
</script>

</body>
</html>
